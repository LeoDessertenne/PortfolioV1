name: Deploiement GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Permissions minimales : lecture du code, ecriture sur Pages uniquement.
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul deploiement a la fois ; on laisse finir celui en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installe exactement les versions du lockfile, sans resolution.
      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
